<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../input.css" />
    <link rel="stylesheet" href="../../output.css" />
    <title>Register</title>
  </head>
  <body class="bg-orange-50 font-[Kantumruy]">
    <section class="min-h-screen flex items-center justify-center">
      <form class="bg-orange-50 p-8 rounded-md shadow-md w-full max-w-2xl">
        <h2 class="text-3xl font-bold text-orange-500 text-center mb-6">
          បញ្ជីគណនី
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-1 font-semibold text-gray-700"
              >នាមខ្លួន</label
            >
            <input
              type="text"
              placeholder="នាមខ្លួន"
              class="w-full border border-orange-400 p-2 rounded"
            />
          </div>
          <div>
            <label class="block mb-1 font-semibold text-gray-700"
              >នាមត្រកូល</label
            >
            <input
              type="text"
              placeholder="នាមត្រកូល"
              class="w-full border border-orange-400 p-2 rounded"
            />
          </div>
        </div>

        <div class="mt-4">
          <label class="block mb-1 font-semibold text-gray-700"
            >លេខអត្តសញ្ញាណ</label
          >
          <input
            type="text"
            placeholder="លេខអត្តសញ្ញាណ"
            class="w-full border border-orange-400 p-2 rounded"
          />
        </div>

        <div class="mt-4">
          <label class="block mb-1 font-semibold text-gray-700">អ៊ីមែល</label>
          <input
            type="email"
            placeholder="អ៊ីមែល"
            class="w-full border border-orange-400 p-2 rounded"
          />
        </div>

        <div class="mt-4">
          <label class="block mb-1 font-semibold text-gray-700"
            >ពាក្យសម្ងាត់</label
          >
          <input
            type="password"
            placeholder="ពាក្យសម្ងាត់"
            class="w-full border border-orange-400 p-2 rounded"
          />
        </div>

        <div class="mt-4">
          <label class="block mb-1 font-semibold text-gray-700"
            >បញ្ជាក់ពាក្យសម្ងាត់</label
          >
          <input
            type="password"
            placeholder="បញ្ជាក់ពាក្យសម្ងាត់"
            class="w-full border border-orange-400 p-2 rounded"
          />
        </div>

        <button
          class="mt-6 bg-orange-400 text-white w-full py-2 rounded hover:bg-orange-500 transition"
        >
          ចុះឈ្មោះ
        </button>

        <p class="text-center text-sm mt-4">
          មានគណនីរួចហើយ?
          <a href="#" class="text-orange-500 font-semibold">ចូលគណនី</a>
        </p>
      </form>
    </section>
  </body>
</html>
